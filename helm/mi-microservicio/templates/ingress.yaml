{{- if .Values.ingress.enabled }}
# Ingress: entrada HTTP al cluster (como en produccion)
# El trafico va Ingress -> Service -> pod sano (no depende de port-forward)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mi-microservicio.fullname" . }}
  labels:
    {{- include "mi-microservicio.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "mi-microservicio.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
