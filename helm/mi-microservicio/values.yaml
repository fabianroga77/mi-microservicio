# Valores por defecto del chart (entorno development)
#
# Este archivo lo usan:
#   - helm install/upgrade (si lo corres a mano)
#   - ArgoCD (lee values.yaml del repo)
#   - el CI (actualiza el tag de la imagen despues de cada build)
#
# Para prod manual ver values-prod.yaml — ArgoCD no lo carga solo.

replicaCount: 1

image:
  # imagen que publica el pipeline en ghcr.io
  repository: ghcr.io/fabianroga77/mi-microservicio
  pullPolicy: IfNotPresent
  # el CI sobrescribe esto con el SHA del commit; no editar a mano salvo la primera vez
  tag: "0d77acc"

service:
  type: ClusterIP
  port: 80           # puerto del Service dentro del cluster
  targetPort: 8000   # puerto donde escucha uvicorn en el contenedor

env:
  # llega a la app como variable de entorno APP_ENV
  APP_ENV: "development"

# PVC para que los JSON de clientes/cuentas/transacciones sobrevivan reinicios del pod
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

resources:
  # limites del pod — en Minikube con poca RAM conviene dejarlo bajo
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Kubernetes llama a /health cada X segundos para saber si el pod esta bien
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10   # espera antes del primer chequeo (la app tarda en arrancar)
  periodSeconds: 30         # si falla, K8S reinicia el pod

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10           # si falla, K8S no le manda trafico hasta que responda
