# Pipeline CI/CD del trabajo K8S
#
# Se dispara con cada push a main. La idea es que nadie tenga que subir
# la imagen a mano ni editar el tag en values.yaml:
#
#   push a main
#     -> build + push imagen a ghcr.io (tag = SHA del commit)
#     -> commit automatico actualizando values.yaml
#     -> ArgoCD ve el cambio y despliega en el cluster
#

name: CI/CD - Build, Push y Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # queda ghcr.io/usuario/mi-microservicio si el repo es de ese usuario
  IMAGE_NAME: ${{ github.repository_owner }}/mi-microservicio

jobs:
  # --- Job 1: construir la imagen y publicarla ---
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write # el job 2 necesita pushear al repo
      packages: write # publicar en ghcr.io

    outputs:
      # pasamos el tag al job 2 para que actualice values.yaml
      image_tag: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Calcular SHA corto del commit
        id: sha
        # tag unico por commit, ej: cb4154d — asi sabemos que codigo tiene la imagen
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Autenticacion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN ya viene en el workflow, no hay que crear secret aparte
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata para el tag de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }}
            type=raw,value=latest

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --- Job 2: decirle a Helm que imagen usar ---
  # ArgoCD lee values.yaml del repo; si el tag no cambia, no despliega nada nuevo
  update-helm-tag:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar tag de imagen en values.yaml
        run: |
          NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          # sed reemplaza la linea "  tag: ..." en values.yaml
          sed -i "s/  tag: .*/  tag: \"${NEW_TAG}\"/" helm/mi-microservicio/values.yaml
          echo "Tag actualizado a: ${NEW_TAG}"

      - name: Commit y push del nuevo tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/mi-microservicio/values.yaml
          if git diff --cached --quiet; then
            echo "El tag no cambio, nada que commitear."
          else
            # [skip ci] para que este commit no vuelva a disparar el pipeline (loop infinito)
            git commit -m "ci: actualizar imagen a ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
            git push
          fi
